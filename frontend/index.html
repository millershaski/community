<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1f21" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src *; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <title>TheCommunity</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TheCommunity" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/config.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
      <div id="scrim" class="scrim"></div>
      <div class="content">
        <header id="topbar" class="topbar"></header>
        <div class="workspace">
          <main id="main" class="main"></main>
          <aside id="detail" class="detail" aria-label="Task details" hidden></aside>
        </div>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>TheCommunity needs JavaScript to run.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
